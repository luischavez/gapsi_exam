[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "google-cloud-firestore>=2.34.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
]
[tool.uv]
dev-dependencies = [
    "httpx2>=2.13.1",
    "pytest",
]
[tool.fastapi]
entrypoint = "app.main:app"
